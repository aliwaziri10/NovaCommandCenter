name: Constraint Gate

on:
  push:
    branches: [main]

jobs:
  check_constraints:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check diff against locked constraints
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'EOF'
          import json, subprocess, re, sys, os

          with open("constraints.json") as f:
              rules = json.load(f)

          diff = subprocess.run(
              ["git", "diff", "HEAD~1", "HEAD"],
              capture_output=True, text=True
          ).stdout

          added_lines = [
              line[1:] for line in diff.splitlines()
              if line.startswith("+") and not line.startswith("+++")
          ]
          added_text = "\n".join(added_lines).lower()

          violations = []
          for pattern in rules["banned_if_added"]:
              if re.search(pattern, added_text, re.IGNORECASE):
                  violations.append(pattern)

          touched_files = set(re.findall(r'^\+\+\+ b/(.+)$', diff, re.MULTILINE))
          protected_files = set(rules.get("protected_files", []))
          required_terms = rules.get("required_if_protected_file_touched", [])
          touched_protected = touched_files & protected_files

          for path in sorted(touched_protected):
              if not os.path.exists(path):
                  continue  # file was deleted in this push; nothing to check
              with open(path, encoding="utf-8", errors="ignore") as f:
                  content = f.read().lower()
              if required_terms and not any(term.lower() in content for term in required_terms):
                  violations.append(
                      f"protected file '{path}' was touched but its current content "
                      f"contains none of the required terms {required_terms}"
                  )

          if violations:
              msg = "Constraint Gate FAILED. Violation(s):\n" + "\n".join(f"- {v}" for v in violations)
              print(msg)
              subprocess.run([
                  "gh", "issue", "create",
                  "--title", "Constraint Gate violation on push to main",
                  "--body", msg
              ], env=os.environ)
              sys.exit(1)
          else:
              print("Constraint Gate passed — no banned patterns added, no protected-file violations.")
          EOF
