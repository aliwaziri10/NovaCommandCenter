name: Generate Narration

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: "Video ID to narrate (leave blank to auto-select)"
        required: false
        type: string
  schedule:
    - cron: "0 */6 * * *"

jobs:
  narrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          pip install chatterbox-tts torchaudio pydub requests

      - name: Run narration
        env:
          RAILWAY_URL: https://novacommandcenter.onrender.com
          VIDEO_ID: ${{ inputs.video_id }}
        run: python .github/scripts/narrate.py
