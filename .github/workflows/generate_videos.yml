name: Generate Video Clips

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: "Video ID to generate video clips for (leave blank to auto-select)"
        required: false
        type: string
  schedule:
    - cron: "30 * * * *"

concurrency:
  # FIX (2026-08-03): the previous fix grouped by video_id, but Agnes's rate
  # limit is account-wide, not per-video - so two DIFFERENT videos generating
  # clips at the same time could still collide and cause 429s. Using one
  # fixed group name for every run (regardless of which video_id) makes any
  # new trigger wait for whichever run is currently using the Agnes account
  # to finish first, no matter which video it's for.
  group: generate-videos-agnes-account
  cancel-in-progress: false

jobs:
  generate_videos:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests==2.32.3

      - name: Run video clip generation
        env:
          RAILWAY_URL: https://novacommandcenter.onrender.com
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          VIDEO_ID: ${{ inputs.video_id }}
        run: python .github/scripts/generate_videos.py
