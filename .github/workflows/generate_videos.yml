name: Generate Video Clips

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: "Video ID to generate video clips for (leave blank to auto-select)"
        required: false
        type: string
  schedule:
    - cron: "30 * * * *"

concurrency:
  group: generate-videos-agnes-account
  cancel-in-progress: false

jobs:
  generate_videos:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests==2.32.3 numpy==1.24.4 moviepy==1.0.3 Pillow==10.4.0 imageio-ffmpeg==0.4.9

      - name: Run video clip generation
        env:
          RAILWAY_URL: https://novacommandcenter.onrender.com
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          VIDEO_ID: ${{ inputs.video_id }}
        run: python .github/scripts/generate_videos.py
      
