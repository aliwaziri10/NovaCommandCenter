name: Generate Video Clips

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: "Video ID to generate video clips for (leave blank to auto-select)"
        required: false
        type: string
  schedule:
    - cron: "30 * * * *"

concurrency:
  # FIX (2026-08-02): no concurrency control meant the supervisor's own
  # ~20-40 min trigger and this workflow's hourly cron could both be running
  # at once, doubling up Agnes submissions (causing the 429 rate-limit
  # failures seen in the logs) and racing to PATCH clip_urls back to the
  # backend, where the loser's progress got silently overwritten. Grouping
  # by video_id (or "scheduled" when auto-selecting) makes a new trigger
  # wait for the current run on that same video to finish instead of
  # running alongside it.
  group: generate-videos-${{ inputs.video_id || 'scheduled' }}
  cancel-in-progress: false

jobs:
  generate_videos:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests==2.32.3

      - name: Run video clip generation
        env:
          RAILWAY_URL: https://novacommandcenter.onrender.com
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          VIDEO_ID: ${{ inputs.video_id }}
        run: python .github/scripts/generate_videos.py
